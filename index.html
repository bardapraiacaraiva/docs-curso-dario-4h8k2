<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso DARIO — Biblioteca dos Sócios</title>
<style>
  :root{--ink:#1a1d23;--paper:#f7f5f0;--accent:#b8862e;--accent-dark:#8f6620;--rule:#d9d4c8;--muted:#5c5f66;--card:#ffffff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink)}
  #login .box{background:#23262d;border:1px solid #3a3e47;border-radius:8px;padding:44px 40px;width:340px;color:var(--paper)}
  #login h1{font-size:22px;font-weight:400;margin-bottom:6px}
  #login p{font-size:13px;color:#9a968c;margin-bottom:26px;font-family:-apple-system,'Segoe UI',sans-serif}
  #login label{display:block;font-family:-apple-system,'Segoe UI',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
  #login input{width:100%;padding:10px 12px;border-radius:5px;border:1px solid #3a3e47;background:#1a1d23;color:var(--paper);font-size:15px}
  #login input:focus{outline:none;border-color:var(--accent)}
  #login button{width:100%;margin-top:24px;padding:12px;background:var(--accent);border:none;border-radius:5px;color:#fff;font-size:15px;cursor:pointer;font-family:-apple-system,'Segoe UI',sans-serif;font-weight:600}
  #login button:hover{background:var(--accent-dark)}
  #login .err{color:#e08a7d;font-size:13px;margin-top:14px;display:none;font-family:-apple-system,'Segoe UI',sans-serif}
  #app{display:none}
  .topbar{background:var(--ink);color:var(--paper);padding:14px 28px;display:flex;align-items:center;gap:16px;font-family:-apple-system,'Segoe UI',sans-serif}
  .topbar .brand{font-size:15px}
  .topbar .brand em{color:#9a968c;font-style:normal;font-size:12px;margin-left:8px}
  .topbar .spacer{flex:1}
  .topbar a,.topbar button{color:var(--accent);text-decoration:none;font-size:13px;background:none;border:none;cursor:pointer;font-family:inherit}
  .layout{display:flex;min-height:calc(100vh - 52px)}
  .sidebar{width:320px;min-width:280px;background:var(--card);border-right:1px solid var(--rule);padding:20px 0;overflow-y:auto;font-family:-apple-system,'Segoe UI',sans-serif}
  .sidebar h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-dark);padding:14px 22px 6px}
  .sidebar a{display:block;padding:5px 22px 5px 34px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.4}
  .sidebar a:hover{background:#f0ece1}
  .sidebar a.active{background:#ece4cd;border-right:3px solid var(--accent);font-weight:600}
  .sidebar a.mod{padding-left:22px;font-weight:600}
  .content{flex:1;padding:44px 52px;max-width:900px;overflow-y:auto}
  .content h1{font-size:30px;font-weight:400;margin-bottom:18px;line-height:1.25}
  .content h2{font-size:23px;font-weight:600;margin:32px 0 12px}
  .content h3{font-size:19px;font-weight:600;margin:26px 0 10px}
  .content h4{font-size:16px;margin:20px 0 8px}
  .content p{margin-bottom:13px}
  .content ul,.content ol{margin:0 0 14px 24px}
  .content li{margin-bottom:6px}
  .content code{font-family:Consolas,monospace;font-size:13px;background:#ece7db;padding:1px 5px;border-radius:3px}
  .content pre{background:var(--ink);color:#d8d4ca;padding:16px 18px;border-radius:6px;overflow-x:auto;margin:14px 0;font-size:12.5px}
  .content pre code{background:none;color:inherit;padding:0}
  .content table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px;background:var(--card)}
  .content th{background:var(--ink);color:var(--paper);text-align:left;padding:8px 11px}
  .content td{padding:8px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
  .content blockquote{border-left:4px solid var(--accent);background:#efeadf;padding:14px 20px;margin:16px 0;color:var(--muted);font-style:italic}
  .content img{max-width:100%}
  .lesson-meta{font-family:-apple-system,'Segoe UI',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  @media(max-width:800px){.layout{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>

<div id="login">
  <form class="box" id="login-form">
    <h1>📚 Curso DARIO</h1>
    <p>Biblioteca dos sócios — acesso restrito</p>
    <label for="u">Utilizador</label>
    <input id="u" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="err" id="err">Utilizador ou password inválidos.</div>
  </form>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">🤖 Curso DARIO <em>Biblioteca dos Sócios</em></div>
    <div class="spacer"></div>
    <a href="https://bardapraiacaraiva.github.io/docs-biblia-7f3k9/" target="_blank" rel="noopener">📖 Bíblia das 622 Skills ↗</a>
    <button id="sair">Sair</button>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="marked.min.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const USERS = {"bernardo":"mkttJdRh37Rt","lele":"EdPXtw1JpTPI"};
  const loginEl = document.getElementById('login');
  const appEl = document.getElementById('app');
  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');

  function authed(){ return sessionStorage.getItem('curso-auth') === '1'; }
  function show(){
    loginEl.style.display = authed() ? 'none' : 'flex';
    appEl.style.display = authed() ? 'block' : 'none';
    if (authed() && !sidebar.dataset.built) buildSidebar();
  }
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    const u = document.getElementById('u').value.trim().toLowerCase();
    const p = document.getElementById('p').value;
    if (USERS[u] && USERS[u] === p){ sessionStorage.setItem('curso-auth','1'); show(); }
    else document.getElementById('err').style.display = 'block';
  });
  document.getElementById('sair').addEventListener('click', function(){
    sessionStorage.removeItem('curso-auth'); location.reload();
  });

  function buildSidebar(){
    sidebar.dataset.built = '1';
    const D = window.COURSE_DATA;
    D.modules.forEach(function(m, mi){
      const h = document.createElement('h3'); h.textContent = m.title; sidebar.appendChild(h);
      m.lessons.forEach(function(l, li){
        const a = document.createElement('a');
        a.href = '#/' + mi + '/' + li;
        a.textContent = (l.id ? l.id + ' — ' : '') + l.title;
        a.className = 'lesson';
        a.dataset.m = mi; a.dataset.l = li;
        sidebar.appendChild(a);
      });
    });
    route();
  }

  function route(){
    const D = window.COURSE_DATA;
    const parts = location.hash.replace(/^#\//,'').split('/');
    let mi = parseInt(parts[0],10), li = parseInt(parts[1],10);
    if (isNaN(mi) || !D.modules[mi]) { mi = 0; li = 0; }
    if (isNaN(li) || !D.modules[mi].lessons[li]) li = 0;
    const mod = D.modules[mi], les = mod.lessons[li];
    document.querySelectorAll('.sidebar a.lesson').forEach(function(a){
      a.classList.toggle('active', a.dataset.m == mi && a.dataset.l == li);
    });
    content.innerHTML = '<div class="lesson-meta">' + mod.title + '</div>' + marked.parse(les.markdown || '*Lição sem conteúdo.*');
    content.scrollTop = 0; window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  show();
})();
</script>
</body>
</html>
